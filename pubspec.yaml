name: project_neptune
description: "Project Neptune - Professional Angling Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^16.3.0

  # Backend
  supabase_flutter: ^2.16.0

  # Networking
  dio: ^5.9.0

  # Environment Variables
  flutter_dotenv: ^5.2.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  equatable: ^2.0.7

  # Local Storage
  shared_preferences: ^2.5.3
  path_provider: ^2.1.6

  # Connectivity
  connectivity_plus: ^7.0.0

  # Location
  geolocator: ^14.0.2

  # Maps
  flutter_map: ^8.2.1
  latlong2: ^0.9.1

  # Documents
  file_picker: ^12.0.0
  open_filex: ^4.5.0

  # Permissions
  permission_handler: ^12.0.1

  # Logging
  logger: ^2.6.1
  firebase_core: ^4.13.0
  firebase_crashlytics: ^5.2.7

  # Sharing
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.5.4
  riverpod_generator: ^2.6.5

  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - .env

  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Regular.ttf
          weight: 400
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-Bold.ttf
          weight: 700
        - asset: assets/fonts/Fraunces-Italic.ttf
          weight: 500
          style: italic
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800