<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    PELAV app icon, Android adaptive icon foreground layer.
    Transparent background (Deep Navy #0B1D2D supplied separately as
    adaptive_icon_background in flutter_launcher_icons.yaml). Same "P"
    geometry as app_icon.svg, at the same scale and position: the glyph's
    own roughly 25-35% margin to the 1024 canvas edge, combined with the
    project's existing adaptive_icon_foreground_inset (16%, applied by
    flutter_launcher_icons when generating mipmap-anydpi-v26/ic_launcher.xml),
    keeps the full "P" comfortably inside Android's ~66dp/108dp adaptive
    safe-zone circle without needing any additional shrink here.
  -->
  <g fill="#DFAE4A">
    <rect x="362" y="260" width="120" height="504" rx="12" />
    <path
      fill-rule="evenodd"
      d="M362,260 L512,260 A150,150 0 0 1 512,560 L362,560 Z
         M482,350 L512,350 A60,60 0 0 1 512,470 L482,470 Z" />
  </g>
</svg>
