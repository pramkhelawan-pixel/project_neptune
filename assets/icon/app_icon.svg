<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    PELAV app icon, full-bleed source (legacy Android; iOS regeneration
    from this file is deliberately not run in this pass, see
    flutter_launcher_icons.yaml).
    Background: Deep Navy #0B1D2D (AppColors.base). Mark: a single
    geometric uppercase "P" in Sand Gold #DFAE4A (AppColors.primaryForeground,
    the current approved token for gold as foreground on navy), built
    from primitive shapes (stem rect plus a ring formed by two concentric
    semicircle paths, evenodd fill) rather than any font glyph. This is an
    application launcher icon only, not a separate PELAV logo or device
    mark: no emblem, no wordmark, no gradient, no shadow.
  -->
  <rect width="1024" height="1024" fill="#0B1D2D"/>
  <g fill="#DFAE4A">
    <rect x="362" y="260" width="120" height="504" rx="12" />
    <path
      fill-rule="evenodd"
      d="M362,260 L512,260 A150,150 0 0 1 512,560 L362,560 Z
         M482,350 L512,350 A60,60 0 0 1 512,470 L482,470 Z" />
  </g>
</svg>
